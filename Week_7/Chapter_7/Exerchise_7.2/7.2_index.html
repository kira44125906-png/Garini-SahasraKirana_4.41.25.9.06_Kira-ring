<!DOCTYPE html> 
<html lang="en"> 
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial scale=1.0"> 
        <title>Simple Tax Calculator</title> 
        <style> 
            body { font-family: Arial, sans-serif; margin: 20px; } 
            label { display: block; margin-bottom: 5px; font-weight: bold; } 
            input[type="number"] { padding: 8px; margin-bottom: 15px; width: 200px; } 
            button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; } 
            button:hover { background-color: #0056b3; } 
            #taxResult { margin-top: 20px; font-size: 1.1em; color: #333; } 
        </style> 
    </head>   
<body> 
    <h1>Simple Income Tax (PPh) Calculator</h1> 
    <p><em>(Fictional rates and calculations for learning purposes)</em></p> 
 
    <label for="grossIncome">Annual Gross Income (IDR):</label> 
    <input type="number" id="grossIncome" min="0" value="0"> 
 
    <label for="numDependents">Number of Dependents:</label> 
    <input type="number" id="numDependents" min="0" value="0"> 
 
    <button id="calculateTaxBtn">Calculate Tax</button> 
 
    <div id="taxResult"> 
        <!-- Calculation results will be displayed here --> 
    </div> 
 
    <script src="simple_tax_calculator.js"></script> 
</body> 
</html>
